<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POKEGAME - Protótipo</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0f1e2e;
    --panel:#e8d9b5;
    --panel-dark:#c9b57e;
    --ink:#1c1408;
    --accent-gold:#e8b93a;
    --accent-green:#3a9d5d;
    --accent-red:#c0392b;
    --accent-blue:#2f6690;
    --border:#1c1408;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg-deep);
    background-image:
      repeating-linear-gradient(rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 2px, transparent 3px),
      radial-gradient(circle at 20% 15%, #1e3350 0%, transparent 45%),
      radial-gradient(circle at 85% 75%, #24314f 0%, transparent 45%),
      linear-gradient(180deg, #0f1e2e 0%, #0a1622 100%);
    font-family:'VT323', monospace; color:var(--ink); font-size:20px;
    display:flex; justify-content:center; padding:16px;
  }
  #app{width:100%; max-width:1100px; display:flex; flex-direction:column; gap:14px;}
  .game-grid{display:grid; grid-template-areas:"left" "center" "right"; grid-template-columns:1fr; gap:14px;}
  .col-left{grid-area:left;} .col-center{grid-area:center;} .col-right{grid-area:right;}
  @media (min-width:1000px){
    .game-grid{grid-template-areas:"left center right"; grid-template-columns:200px minmax(340px,1fr) 300px; align-items:start;}
  }
  .quick-team-card{border:2px solid var(--border); border-radius:3px; padding:6px; background:#fffdf3; margin-bottom:6px; font-size:14px;}
  .quick-team-card .hp-bar-outer{height:8px;}
  .box{
    background:var(--panel); border:4px solid var(--border); border-radius:4px;
    box-shadow:
      0 0 0 2px #7a6a3e inset,
      -2px -2px 0 1px rgba(255,255,255,0.35) inset,
      2px 2px 0 1px rgba(0,0,0,0.3) inset,
      6px 6px 0 rgba(0,0,0,0.4);
    padding:16px;
  }
  h1,h2,h3{margin:0 0 10px 0;}
  h1{font-size:16px; color:var(--accent-gold); text-shadow:2px 2px 0 #000; text-align:center;}
  h2{font-size:13px; color:var(--accent-blue);}
  h3{font-size:12px; color:var(--accent-red);}
  button{
    font-family:'VT323', monospace; font-size:18px; cursor:pointer;
    background:var(--accent-blue); color:#fff; border:3px solid var(--border);
    border-radius:3px; padding:7px 12px;
    box-shadow:3px 3px 0 rgba(0,0,0,0.4), -1px -1px 0 rgba(255,255,255,0.25) inset, 1px 1px 0 rgba(0,0,0,0.25) inset;
    transition:transform .05s; text-shadow:1px 1px 0 rgba(0,0,0,0.35);
  }
  button:hover{filter:brightness(1.15);}
  button:active{transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.4);}
  @media (max-width:600px), (pointer:coarse){
    button{ font-size:20px; padding:12px 16px; min-height:44px; }
    .float-buttons{ gap:10px; padding:12px; }
    .float-buttons button{ font-size:18px; padding:14px 16px; }
    .dpad{ grid-template-columns:repeat(3,58px); grid-template-rows:repeat(3,58px); gap:6px; }
    button.dir{ font-size:26px; }
    .tabs button{ font-size:16px; padding:10px 14px; }
    input, select{ font-size:18px; padding:10px; min-height:40px; }
  }
  button.gold{background:var(--accent-gold); color:#1c1408;}
  button.green{background:var(--accent-green);}
  button.red{background:var(--accent-red);}
  button.dir{font-size:20px; padding:8px 12px;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  input, select{
    font-family:'VT323',monospace; font-size:20px; padding:6px;
    border:3px solid var(--border); border-radius:3px; background:#fffdf3;
  }
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .center{display:flex; align-items:center; justify-content:center;}

  .board-wrap{display:flex; justify-content:center; margin:10px 0;}
  .grid16{display:grid; grid-template-columns:repeat(6, 1fr); gap:clamp(2px,0.6vw,4px); width:min(360px, 92vw);}
  .tile{
    position:relative; border:1.5px solid var(--border); aspect-ratio:1; width:100%;
    border-radius:2px; display:flex; align-items:center; justify-content:center;
    overflow:hidden; cursor:default;
  }
  .tile.current-zone{ outline:2px solid var(--accent-gold); outline-offset:-2px; }
  .tile.center-zone{ background:#c0392b !important; }
  .tile.shop-zone{ background:#c9a227 !important; }
  .tile.tunnel-zone{ outline:2px dashed #8fe3ff; outline-offset:-2px; }
  .tunnel-flag{position:absolute; top:0; right:1px; font-size:9px;}
  .tile .tokens{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:1px; flex-wrap:wrap;}
  .tile .zlabel{position:absolute; top:0; left:1px; font-size:clamp(6px,1.6vw,8px); color:rgba(255,255,255,.65); line-height:1;}
  .token-sprite{transition:transform .15s; position:relative;}
  .turn-arrow{position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); font-size:9px; color:var(--accent-gold); animation:bounceArrow .6s infinite alternate;}
  @keyframes bounceArrow{from{transform:translateX(-50%) translateY(0);} to{transform:translateX(-50%) translateY(-2px);}}
  @media (min-width:700px){ .grid16{ width:420px; } }
  @media (min-width:1100px){ .grid16{ width:480px; } }
  .event-flag{position:absolute; bottom:0; right:1px; font-size:8px;}

  .terra-1{background:linear-gradient(160deg,#7a52b0 0%,#4a2d6e 100%);}
  .terra-2{background:linear-gradient(160deg,#3f8bb0 0%,#1f4d66 100%);}
  .terra-3{background:linear-gradient(160deg,#2ca0d6 0%,#155a78 100%);}
  .terra-4{background:linear-gradient(160deg,#4a9758 0%,#234f2b 100%);}
  .terra-5{background:linear-gradient(160deg,#54a066 0%,#295c34 100%);}
  .terra-6{background:linear-gradient(160deg,#4fb0ac 0%,#256662 100%);}
  .terra-7{background:linear-gradient(160deg,#7d9142 0%,#454f1f 100%);}
  .terra-8{background:linear-gradient(160deg,#a37943 0%,#5c3f1e 100%);}

  .dpad{display:grid; grid-template-columns:repeat(3,46px); grid-template-rows:repeat(3,46px); gap:3px; margin:8px auto;}
  .dpad .empty{visibility:hidden;}

  .log{max-height:180px; overflow-y:auto; background:#fffdf3; border:2px solid var(--border); padding:8px; font-size:16px;}
  .log div{border-bottom:1px dashed #ccc; padding:3px 0;}
  .dicelog{max-height:130px; overflow-y:auto; background:#111a24; color:#8fe3a3; border:2px solid var(--border); padding:8px; font-size:15px; font-family:'VT323',monospace;}
  .dicelog div{border-bottom:1px dashed #2a3a2a; padding:2px 0;}

  .player-card{border:2px solid var(--border); border-radius:3px; padding:8px; background:#fffdf3; font-size:16px; position:relative;}
  .slot-badge{position:absolute; top:6px; right:6px; font-size:12px; padding:2px 6px; border-radius:3px; border:2px solid var(--border);}
  .slot-badge.ativo{background:var(--accent-green); color:#fff;}
  .slot-badge.mochila{background:#999; color:#fff;}
  .fainted{opacity:.5;}
  .hp-bar-outer{background:#333; border:2px solid #000; border-radius:3px; height:14px; width:100%;}
  .hp-bar-inner{background:var(--accent-green); height:100%; border-radius:1px; transition:width .3s;}
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:70; padding:16px;}
  .modal{max-width:540px; width:100%; max-height:90vh; overflow-y:auto;}
  .tabs{display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;}
  .tabs button{font-size:14px; padding:5px 10px;}
  .hidden{display:none !important;}
  .small{font-size:14px; color:#444;}
  textarea{width:100%; font-family:'VT323',monospace; font-size:16px; padding:6px; border:2px solid var(--border);}
  .shop-item{display:flex; justify-content:space-between; align-items:center; border:2px solid var(--border); border-radius:3px; padding:6px 10px; background:#fffdf3; margin-bottom:6px;}

  #toastLayer{position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:6px; align-items:center;}
  .dice-toast{
    background:#111a24; color:#ffe08a; border:3px solid var(--accent-gold); border-radius:4px;
    padding:8px 14px; font-family:'VT323',monospace; font-size:19px; opacity:0; transform:translateY(-14px) scale(.9);
    transition:opacity .25s, transform .25s; box-shadow:3px 3px 0 rgba(0,0,0,.5); white-space:nowrap;
  }
  .dice-toast.show{opacity:1; transform:translateY(0) scale(1);}

  #bigToastLayer{position:fixed; top:36%; left:50%; transform:translate(-50%,-50%); z-index:110; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .big-toast{
    border:4px solid; border-radius:6px; padding:14px 26px; font-family:'VT323',monospace;
    font-size:26px; text-align:center; opacity:0; transform:scale(.8); transition:opacity .3s, transform .3s;
    box-shadow:5px 5px 0 rgba(0,0,0,.4);
  }
  .big-toast.show{opacity:1; transform:scale(1);}
  .big-toast.good{background:#1c3a24; color:#8fe3a3; border-color:var(--accent-green);}
  .big-toast.bad{background:#3a1c1c; color:#ffb3b3; border-color:var(--accent-red);}

  #floatingPanel{
    position:fixed; z-index:40; width:240px;
    background:var(--panel); border:3px solid var(--border); border-radius:4px;
    box-shadow:5px 5px 0 rgba(0,0,0,.4);
  }
  .float-handle{
    background:var(--accent-blue); color:#fff; padding:6px 8px; font-size:14px;
    cursor:move; border-bottom:2px solid var(--border); user-select:none;
    display:flex; justify-content:space-between; align-items:center;
  }
  .float-buttons{padding:8px; display:flex; flex-direction:column; gap:6px;}
  .float-buttons button{width:100%; font-size:15px; text-align:left;}

  @keyframes hop{0%{transform:translateY(0);} 40%{transform:translateY(-6px);} 100%{transform:translateY(0);}}
  .anim-hop{animation:hop .25s ease-in-out;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
  .anim-shake{animation:shake .35s;}
  @keyframes spinIcon{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  .anim-spin{display:inline-block; animation:spinIcon .5s linear;}
</style>

const TERRAIN_THEMES = [
  {id:1, name:"Pântano Sombrio", css:"terra-1", types:["Venenoso","Voador"]},
  {id:2, name:"Brejo Costeiro", css:"terra-2", types:["Água","Terra"]},

];
function themeOfZone(z){ return TERRAIN_THEMES[(z-1)%8]; }

const MAP_SIZES = { pequeno:4, medio:6, grande:8 };
let GRID_SIZE = 6;
let TOTAL_ZONES = GRID_SIZE*GRID_SIZE;
let CENTER_ZONE = 16; // Centro Pokémon
let SHOP_ZONE = 21; // Loja
let TUNNEL_ZONES = new Set();
function zoneToRC(z){ const i=z-1; return {r:Math.floor(i/GRID_SIZE), c:i%GRID_SIZE}; }
function rcToZone(r,c){ const rr=((r%GRID_SIZE)+GRID_SIZE)%GRID_SIZE, cc=((c%GRID_SIZE)+GRID_SIZE)%GRID_SIZE; return rr*GRID_SIZE+cc+1; }
/** Só quem está numa zona-túnel pode atravessar a borda do mapa (mapa NÃO é infinito em toda parte). */
function neighborZone(z, dir){
  const {r,c} = zoneToRC(z);
  let nr=r, nc=c;
  if(dir==='up') nr=r-1;
  if(dir==='down') nr=r+1;
  if(dir==='left') nc=c-1;
  if(dir==='right') nc=c+1;
  const crossesBorder = nr<0 || nr>=GRID_SIZE || nc<0 || nc>=GRID_SIZE;
  if(crossesBorder && !TUNNEL_ZONES.has(z)) return null;
  return rcToZone(nr,nc);
}
function computeTunnels(){
  TUNNEL_ZONES = new Set();
  const g = GRID_SIZE;
  const offs = Array.from(new Set([Math.floor(g/4), Math.floor(3*g/4)])).filter(o=>o>=0 && o<g);
  offs.forEach(o=>{
    TUNNEL_ZONES.add(rcToZone(0,o));
    TUNNEL_ZONES.add(rcToZone(g-1,o));
    TUNNEL_ZONES.add(rcToZone(o,0));
    TUNNEL_ZONES.add(rcToZone(o,g-1));
  });
}
function computeStartZones(numPlayers){
  const g = GRID_SIZE;
  const mid = Math.floor(g/2);
  const pts = [
    rcToZone(0,0), rcToZone(0,g-1), rcToZone(g-1,0), rcToZone(g-1,g-1),
    rcToZone(0,mid), rcToZone(g-1,mid), rcToZone(mid,0), rcToZone(mid,g-1)
  ];
  return pts.slice(0, numPlayers);
}
function setupMap(sizeKey){
  GRID_SIZE = MAP_SIZES[sizeKey] || 6;
  TOTAL_ZONES = GRID_SIZE*GRID_SIZE;
  const mid = Math.floor(GRID_SIZE/2);
  CENTER_ZONE = rcToZone(mid, mid);
  SHOP_ZONE = rcToZone(mid, Math.max(0,mid-1));
  computeTunnels();
}

function generateMission(tier, p){
  const tpl = pick(MISSION_TEMPLATES[tier])();
  tpl.tier = tier;
  tpl.id = Math.random().toString(36).slice(2,9);
  tpl.progress = 0;
  tpl.done = false;
  if(tpl.type==='visit_zones'){ tpl.baselineZones = p ? p.zonesVisited.size : 0; }
  return tpl;
}
function completeMission(p, ms){
  ms.done = true;
  p.gold += ms.rewardGold;
  if(p.team[0]) gainXP(p.team[0], ms.rewardXp, p);
  logEvent(`${p.name} completou a missão "${ms.desc}" e recebeu 💰${ms.rewardGold} + ${ms.rewardXp} XP!`);
  showBigMessage(`✅ Missão concluída: ${ms.desc}!`, 'good');
  const idx = p.missions.indexOf(ms);
  p.missions[idx] = generateMission(ms.tier, p);
}
/** Avança o progresso de todas as missões ativas do jogador que casam com o evento ocorrido. */
function processMissionEvent(p, eventType, payload){
  p.missions.forEach(ms=>{
    if(ms.done) return;
    let increment = false;
    if(eventType==='capture'){
      if(ms.type==='capture_any') increment=true;
      else if(ms.type==='capture_type' && payload.types.includes(ms.targetType)) increment=true;
      else if(ms.type==='capture_rarity' && payload.rarity===ms.targetRarity) increment=true;
    } else if(ms.type===eventType){
      increment=true;
    }
    if(increment){
      ms.progress++;
      if(ms.progress>=ms.target) completeMission(p, ms);
    }
  });
}
function checkVisitMissions(p){
  p.missions.forEach(ms=>{
    if(ms.done || ms.type!=='visit_zones') return;
    ms.progress = p.zonesVisited.size - ms.baselineZones;
    if(ms.progress>=ms.target) completeMission(p, ms);
  });
}

const SPRITE_GRID = 12;
function hexVariant(hex, amt){
  hex = hex.replace('#','');
  const num = parseInt(hex,16);
  let r=(num>>16)+amt, g=((num>>8)&0xff)+amt, b=(num&0xff)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function hslVariant(hslStr, deltaL){
  const m = hslStr.match(/hsl\(([\d.]+),([\d.]+)%,([\d.]+)%\)/);
  if(!m) return hslStr;
  const h=+m[1], s=+m[2], l=+m[3];
  const nl = Math.max(4,Math.min(96,l+deltaL));
  return `hsl(${h},${s}%,${nl}%)`;
}
function ellipseCells(cx,cy,rx,ry){
  const cells=[];
  for(let y=0;y<SPRITE_GRID;y++){
    for(let x=0;x<SPRITE_GRID;x++){
      const dx=(x+0.5-cx)/rx, dy=(y+0.5-cy)/ry;
      if(dx*dx+dy*dy<=1) cells.push([x,y]);
    }
  }
  return cells;
}
function rectCells(x0,y0,w,h){
  const cells=[];
  for(let y=y0;y<y0+h;y++) for(let x=x0;x<x0+w;x++) cells.push([x,y]);
  return cells;
}
/** Renderiza um mapa de células ("x,y" -> papel de cor) como pixel art, com contorno escuro
    automático (calculado por dilatação: qualquer célula vizinha a uma célula preenchida vira contorno). */
function renderPixelSVG(cellMap, colorMap, size, extra){
  const filledKeys = Object.keys(cellMap);
  const filledSet = new Set(filledKeys);
  const deltas=[[1,0],[-1,0],[0,1],[0,-1]];
  const outline = new Set();
  filledKeys.forEach(key=>{
    const [x,y]=key.split(',').map(Number);
    deltas.forEach(([dx,dy])=>{
      const nk=(x+dx)+','+(y+dy);
      if(!filledSet.has(nk)) outline.add(nk);
    });
  });
  let body = '';
  outline.forEach(key=>{
    const [x,y]=key.split(',').map(Number);
    body += `<rect x="${x}" y="${y}" width="1" height="1" fill="#1c1408"/>`;
  });
  filledKeys.forEach(key=>{
    const [x,y]=key.split(',').map(Number);
    const role = cellMap[key];
    body += `<rect x="${x}" y="${y}" width="1" height="1" fill="${colorMap[role]||colorMap.B}"/>`;
  });
  return `<svg width="${size}" height="${size}" viewBox="-1 -1 ${SPRITE_GRID+2} ${SPRITE_GRID+2}" shape-rendering="crispEdges" style="display:block;">${body}${extra||''}</svg>`;
}
function trainerSpriteSVG(color, size, gender){
  size = size || 16;
  const light = hexVariant(color, 45);
  const dark = hexVariant(color, -45);
  const hairCells = rectCells(4,0,4,2);
  const faceCells = rectCells(4,2,4,2);
  let bodyCells, legsCells, skirtCells=[];
  if(gender==='menina'){
    bodyCells = rectCells(3,4,6,4);
    skirtCells = rectCells(2,8,8,2);
    legsCells = [...rectCells(4,10,1,2), ...rectCells(7,10,1,2)];
  } else {
    bodyCells = rectCells(3,4,6,5);
    legsCells = [...rectCells(4,9,1,3), ...rectCells(7,9,1,3)];
  }
  const cellMap = {};
  hairCells.forEach(([x,y])=>cellMap[x+','+y]='H');
  faceCells.forEach(([x,y])=>cellMap[x+','+y]='K');
  const allBody = [...bodyCells, ...skirtCells];
  const xs = allBody.map(([x,y])=>x+y);
  const minV=Math.min(...xs), maxV=Math.max(...xs), range=(maxV-minV)||1;
  allBody.forEach(([x,y])=>{
    const t=((x+y)-minV)/range;
    cellMap[x+','+y] = t<0.3?'L':(t>0.75?'D':'B');
  });
  legsCells.forEach(([x,y])=>cellMap[x+','+y]='P');
  cellMap['5,3']='E'; cellMap['6,3']='E';
  if(gender==='menina') cellMap['4,0']='M';
  const colorMap = {H:'#3a2a1a', K:'#ffd9a0', B:color, L:light, D:dark, P:'#2a2a2a', E:'#1c1408', M:'#e84393'};
  return renderPixelSVG(cellMap, colorMap, size);
}

const TYPE_HUE = {Fogo:14, Água:205, Grama:125, Elétrico:48, Terra:32, Voador:200, Venenoso:275, Psiquico:320, Lutador:8, Dragão:250, Normal:40};
const RARITY_LIGHT = {"Muito comum":45,"Comum":48,"Incomum":50,"Raro":52,"Muito raro":55,"Épico":58,"Lendário":80};
const RARITY_SAT = {"Muito comum":45,"Comum":50,"Incomum":55,"Raro":60,"Muito raro":65,"Épico":70,"Lendário":25};
function hashNum(str){ let h=0; for(let i=0;i<str.length;i++){ h = (h*131 + str.charCodeAt(i)) >>> 0; } return h; }
function monColor(category, rarity, name){
  const hueBase = TYPE_HUE[category]!==undefined ? TYPE_HUE[category] : 40;
  const jitter = (hashNum(name)%30)-15;
  const hue = ((hueBase+jitter)%360+360)%360;
  const light = RARITY_LIGHT[rarity]||50;
  const sat = RARITY_SAT[rarity]||50;
  return `hsl(${hue},${sat}%,${light}%)`;
}

  const light = hslVariant(base, 16);
  const dark = hslVariant(base, -18);
  const accent = CATEGORY_ACCENT[category] || dark;
  const body = ellipseCells(6, 6.6, 4.6, 4.0);
  const xs = body.map(([x,y])=>x+y);
  const minV = Math.min(...xs), maxV = Math.max(...xs);
  const range = (maxV-minV)||1;
  const cellMap = {};
  body.forEach(([x,y])=>{
    const t = ((x+y)-minV)/range;
    cellMap[x+','+y] = t<0.32 ? 'L' : (t>0.72 ? 'D' : 'B');
  });
  cellMap['4,6'] = 'E';
  cellMap['8,6'] = 'E';
  (CATEGORY_FEATURES[category]||[]).forEach(([x,y,role])=>{
    if(x>=0 && x<SPRITE_GRID && y>=0 && y<SPRITE_GRID) cellMap[x+','+y]=role;
  });
  const colorMap = {B:base, L:light, D:dark, E:'#1c1408', F:accent};
  return renderPixelSVG(cellMap, colorMap, size, rarityOrnament(dex.rarity));
}

/* teclado: espaço inicia turno, setas/WASD movem, números 1-5 são atalhos contextuais */
document.addEventListener('keydown', (e)=>{
  const tag = document.activeElement && document.activeElement.tagName;
  if(tag==='INPUT' || tag==='TEXTAREA') return;
  if(onlineMode && !myTurnStarted){
    if(e.key===' ' && amIInControl()){ e.preventDefault(); confirmMyTurnStart(); }
    return;
  }
  const iAmChallengeTarget = onlineMode && state && state.pendingChallengeInfo && state.pendingChallengeInfo.targetId===myPlayerId;
  if(!iAmChallengeTarget){
    if(state && state.players && state.players[state.currentPlayerIdx] && state.players[state.currentPlayerIdx].isBot) return;
    if(typeof amIInControl==='function' && !amIInControl()) return;
  }
  if(state && state.awaitingStart){
    if(e.key===' '){ e.preventDefault(); proceedTurn(); }
    return;
  }
  const dirMap = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right', w:'up',a:'left',s:'down',d:'right', W:'up',A:'left',S:'down',D:'right'};
  if(state && state.phase==='moving' && dirMap[e.key]){
    const dir = dirMap[e.key];
    const lastDir = state.moveHistory[state.moveHistory.length-1];
    const isUndoMove = lastDir && OPPOSITE_DIR[dir]===lastDir;
    if(state.stepsRemaining>0 || isUndoMove){ e.preventDefault(); stepMove(dir); }
    return;
  }
  if(numericShortcuts[e.key]){ e.preventDefault(); numericShortcuts[e.key](); }
});

/* Padrão exato de bônus por raridade: cada número é um bônus aplicado a um atributo
   DIFERENTE dos anteriores (Força, Defesa, Velocidade ou PV — nunca repete o mesmo). */
const RARITY_BONUS_PATTERN = {
  "Muito comum": [],
  "Comum": [1],
  "Incomum": [1,1],
  "Raro": [2,1],
  "Muito raro": [2,1,1],
  "Épico": [3,2,1],
  "Lendário": [3,3,2,1]
};
/** Distribui os bônus da raridade entre atk/def/vel/pvMax sem repetir atributo.
    Bônus que caem em PV valem x5 (PV base é numa escala bem maior que os outros atributos).
    Se um array `log` for passado, registra qual atributo recebeu quanto (usado na tela de detalhes). */
function applyRarityBonus(mon, rarity, log){
  const pattern = RARITY_BONUS_PATTERN[rarity] || [];
  let available = ['atk','def','vel','pv'];
  pattern.forEach(amount=>{
    const idx = Math.floor(Math.random()*available.length);
    const attr = available.splice(idx,1)[0];
    if(attr==='pv'){ mon.pvMax += amount*5; mon.pv += amount*5; if(log) log.push({attr:'Vida', amount:amount*5}); }
    else { mon[attr] += amount; if(log) log.push({attr: attr==='atk'?'Força':attr==='def'?'Defesa':'Velocidade', amount}); }
  });
}
/** Cadeias de evolução reais (usando as próprias espécies já presentes na pokédex).
    Ao evoluir, o pokémon passa a ter o nome, raridade e tipo(s) da sua forma evoluída. */
const EVOLUTION_MAP = {
  "Bulbasaur":"Ivysaur", "Ivysaur":"Venusaur",
  "Charmander":"Charmeleon", "Charmeleon":"Charizard",
  "Squirtle":"Wartortle", "Wartortle":"Blastoise",
  "Caterpie":"Metapod", "Metapod":"Butterfree",
  "Weedle":"Kakuna", "Kakuna":"Beedrill",
  "Pidgey":"Pidgeotto", "Pidgeotto":"Pidgeot",
  "Rattata":"Raticate", "Spearow":"Fearow", "Ekans":"Arbok",
  "Pikachu":"Raichu", "Sandshrew":"Sandslash",
  "Nidoran♀":"Nidorina", "Nidoran♂":"Nidorino",
  "Clefairy":"Clefable", "Vulpix":"Ninetales", "Jigglypuff":"Wigglytuff",
  "Zubat":"Golbat", "Oddish":"Gloom", "Gloom":"Vileplume",
  "Paras":"Parasect", "Venonat":"Venomoth", "Digglet":"Dugtrio",
  "Meowth":"Persian", "Psyduck":"Golduck", "Mankey":"Primeape",
  "Growlithe":"Arcanine", "Poliwag":"Poliwhirl", "Poliwhirl":"Poliwrath",
  "Abra":"Kadabra", "Kadabra":"Alakazam",
  "Machop":"Machoke", "Machoke":"Machamp",
  "Bellsprout":"Weepinbell", "Weepinbell":"Victreebel",
  "Tentacool":"Tentacruel", "Geodude":"Graveler", "Graveler":"Golem",
  "Ponyta":"Rapidash", "Slowpoke":"Slowbro", "Magnemite":"Magneton",
  "Doduo":"Dodrio", "Seel":"Dewgong", "Grimer":"Muk", "Shellder":"Cloyster",
  "Gastly":"Haunter", "Haunter":"Gengar", "Drowzee":"Hypno",
  "Krabby":"Kingler", "Voltorb":"Electrode", "Exeggcute":"Exeggutor",
  "Cubone":"Marowak", "Koffing":"Weezing", "Rhyhorn":"Rhydon",
  "Horsea":"Seadra", "Goldeen":"Seaking", "Staryu":"Starmie",
  "Magikarp":"Gyarados", "Omanyte":"Omastar", "Kabuto":"Kabutops",
  "Dratini":"Dragonair", "Dragonair":"Dragonite"
};
const EEVEE_EVOLUTIONS = ["Vaporeon","Jolteon","Flareon"];
function evolutionTargetName(mon){
  if(mon.name==='Eevee') return pick(EEVEE_EVOLUTIONS);
  return EVOLUTION_MAP[mon.name] || null;
}
/** Tenta evoluir o mon se ele atingiu o nível de evolução da sua raridade e existe uma
    próxima forma conhecida. Atualiza nome, raridade e tipo(s) para os da forma evoluída. */
function tryEvolve(mon, player){
  if(mon.evolved) return false;
  const evoLvl = RARITY_INFO[mon.rarity].evoLevel;
  if(!evoLvl || mon.level<evoLvl) return false;
  const nextName = evolutionTargetName(mon);
  if(!nextName) return false;
  const nextDex = POKEDEX.find(d=>d.name===nextName);
  if(!nextDex) return false;
  const oldName = mon.name;
  mon.evolved = true;
  mon.name = nextDex.name;
  mon.rarity = nextDex.rarity;
  mon.types = nextDex.types;
  mon.category = typeCategory(nextDex.types[0]);
  mon.atk += 3; mon.def += 3; mon.vel += 2; mon.pvMax += 15; mon.pv = mon.pvMax;
  logEvent(`✨ ${oldName} evoluiu para ${mon.name}! Agora é ${rarityLabel(mon.rarity)}, tipo ${mon.types.join(' / ')}.`);
  if(player) processMissionEvent(player, 'evolve');
  return true;
}
const STARTER_NAMES = ["Pikachu","Charmander","Squirtle","Bulbasaur"];
/** Dá ao jogador o pokémon inicial escolhido na tela de configuração. */
function giveStarterPokemon(p, starterName){
  const dex = POKEDEX.find(d=>d.name===starterName) || POKEDEX.find(d=>d.name==='Pikachu');
  const mon = newPokemonInstance(dex);
  p.team.push(mon);
}
function newPokemonInstance(dexEntry){
  const base = RARITY_INFO[dexEntry.rarity].stats;
  const mon = {
    id: Math.random().toString(36).slice(2,9),
    name: dexEntry.name, rarity: dexEntry.rarity,
    types: dexEntry.types, category: typeCategory(dexEntry.types[0]),
    atk: base.atk, def: base.def, vel: base.vel, pvMax: base.pv, pv: base.pv,
    level:1, xp:0, evolved:false, speedAccum:0, captureBonusLog:[]
  };
  applyRarityBonus(mon, dexEntry.rarity, mon.captureBonusLog);
  mon.pv = mon.pvMax;
  return mon;
}
/** Faz um pokémon "nascer" já num nível alvo, aplicando o mesmo crescimento de level up
    (usado pros selvagens: nascem no nível do slot 1 do jogador). Não concede XP, é instantâneo. */
function syntheticLevelUp(mon, targetLevel){
  while(mon.level < targetLevel){
    mon.level++;
    mon.atk += 1; mon.def += 1; mon.vel += 1;
    applyRarityBonus(mon, mon.rarity);
    tryEvolve(mon, null);
  }
  mon.pv = mon.pvMax;
}
function xpToNext(level){ return 100*level; }
function gainXP(mon, amount, player){
  mon.xp += amount;
  while(mon.xp >= xpToNext(mon.level)){
    mon.xp -= xpToNext(mon.level);
    mon.level++;
    mon.atk += 1; mon.def += 1; mon.vel += 1;
    applyRarityBonus(mon, mon.rarity);
    logEvent(`${mon.name} subiu para o nível ${mon.level}! (+1 em cada atributo base, + bônus de raridade)`);
    tryEvolve(mon, player);
  }
}

function serializeState(){
  const copy = JSON.parse(JSON.stringify(state, (k,v)=> v instanceof Set ? Array.from(v) : v));
  copy.__mapMeta = { GRID_SIZE, TOTAL_ZONES, CENTER_ZONE, SHOP_ZONE, TUNNEL_ZONES: Array.from(TUNNEL_ZONES) };
  return btoa(unescape(encodeURIComponent(JSON.stringify(copy))));
}
function restoreMapMeta(obj){
  if(obj.__mapMeta){
    GRID_SIZE = obj.__mapMeta.GRID_SIZE;
    TOTAL_ZONES = obj.__mapMeta.TOTAL_ZONES;
    CENTER_ZONE = obj.__mapMeta.CENTER_ZONE;
    SHOP_ZONE = obj.__mapMeta.SHOP_ZONE;
    TUNNEL_ZONES = new Set(obj.__mapMeta.TUNNEL_ZONES);
    delete obj.__mapMeta;
  }
}
function generateSaveCode(){ prompt("Sua senha de save (copie e guarde):", serializeState()); }
function loadFromCode(){
  const raw = document.getElementById('loadCodeInput').value.trim();
  try{
    const obj = JSON.parse(decodeURIComponent(escape(atob(raw))));
    restoreMapMeta(obj);
    obj.players.forEach(p=>{ p.zonesVisited = new Set(p.zonesVisited); });
    state = obj;
    document.getElementById('screen-setup').classList.add('hidden');
    document.getElementById('screen-game').classList.remove('hidden');
    logEvent("Save carregado por senha.");
    renderGame();
  }catch(e){ alert("Senha inválida ou corrompida."); }
}

  if(p.team.length===0){ wrap.innerHTML = '<p class="small">Sem pokémons ainda.</p>'; return; }
  wrap.innerHTML = p.team.slice(0,MAX_ACTIVE).map((m,i)=>`
    <div class="quick-team-card ${m.pv<=0?'fainted':''}">
      <div class="row" style="gap:4px;">
        <div>${monsterSpriteSVG(m,26)}</div>

          <b>${m.name}</b> ${m.evolved?'✨':''}<br>

          <span class="small">${m.pv}/${m.pvMax} · Lvl ${m.level}</span>

function showTab(name){
  ['team','items','mission','history','save'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('hidden', t!==name);
  });
}
function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML='';
  const p = state.players[state.currentPlayerIdx];
  for(let z=1; z<=TOTAL_ZONES; z++){
    const theme = themeOfZone(z);
    const div = document.createElement('div');
    const isCenter = z===CENTER_ZONE;
    const isShop = z===SHOP_ZONE;
    const isTunnel = TUNNEL_ZONES.has(z);
    div.className = `tile ${isCenter?'center-zone':isShop?'shop-zone':theme.css}` + (z===p.zone ? ' current-zone' : '') + (isTunnel?' tunnel-zone':'');
    div.title = isCenter ? `Zona ${z} — Centro Pokémon 🏥` : isShop ? `Zona ${z} — Loja 🏪` : (isTunnel ? `Zona ${z} — ${theme.name} (túnel 🌀, atravessa a borda do mapa)` : `Zona ${z} — ${theme.name}`);
    const isEvent = !isCenter && !isShop && state.eventActive && theme.types.some(t=>typeCategory(t)===state.eventActive);
    div.innerHTML = `<span class="zlabel">${isCenter?'🏥':isShop?'🏪':z}</span>${isTunnel?'<div class="tunnel-flag">🌀</div>':''}${isEvent?'<div class="event-flag">🌟</div>':''}<div class="tokens">${
      state.players.filter(pl=>pl.zone===z && !pl.eliminated).map(pl=>`<div class="token-sprite ${pl.id===state.currentPlayerIdx?'current-turn-token':''}" id="tokenP${pl.id}">${trainerSpriteSVG(pl.color,13,pl.gender)}${pl.id===state.currentPlayerIdx?'<div class="turn-arrow">▲</div>':''}</div>`).join('')
    }</div>`;
    board.appendChild(div);
  }
}

function showMonDetailsModal(monId){
  const p = state.players[state.currentPlayerIdx];
  const m = p.team.find(x=>x.id===monId);
  if(!m) return;
  const evoLvl = RARITY_INFO[m.rarity].evoLevel;
  const nextName = m.evolved ? null : (m.name==='Eevee' ? 'Vaporeon/Jolteon/Flareon (aleatório)' : EVOLUTION_MAP[m.name]);
  const bonusList = (m.captureBonusLog && m.captureBonusLog.length>0)
    ? m.captureBonusLog.map(b=>`${b.attr} +${b.amount}`).join(', ')
    : 'Nenhum (Muito comum não recebe bônus na captura)';
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='monDetailsModal';
  overlay.innerHTML = `<div class="box modal">
    <h2>${monsterSpriteSVG(m,32)} ${m.name}</h2>
    <p>Raridade: ${rarityLabel(m.rarity)} · Categoria: ${m.category} · Tipo(s): ${m.types.join(' / ')}</p>
    <p><b>Bônus de captura recebido:</b> ${bonusList}</p>
    <p><b>Atributos atuais:</b> 💪 Força ${m.atk} · 🛡️ Defesa ${m.def} · ⚡ Velocidade ${m.vel} · ❤️ Vida ${m.pvMax}</p>
    <p><b>Nível atual:</b> ${m.level} — XP ${m.xp}/${xpToNext(m.level)}</p>
    <p><b>Evolução:</b> ${m.evolved ? '✨ já evoluiu' : (evoLvl && nextName ? `no nível ${evoLvl}, vira ${nextName}` : (evoLvl ? `no nível ${evoLvl} (mas não tem próxima forma conhecida)` : 'não evolui'))}</p>
    <button class="gold" onclick="document.getElementById('monDetailsModal').remove()">Fechar</button>
  </div>`;
  document.body.appendChild(overlay);
}
function reorderTeam(i, dir){
  const p = state.players[state.currentPlayerIdx];
  const j = i+dir;
  if(j<0 || j>=p.team.length) return;
  [p.team[i], p.team[j]] = [p.team[j], p.team[i]];
  logEvent(`${p.name} reorganizou o time.`);
  renderTeamTab();
}

let itemsSubTab = 'inventory';
function masterBallAvailable(p){
  if(!(p.items['Master Ball']>0)) return false;
  if(p.masterBallLastUsedTurn===null || p.masterBallLastUsedTurn===undefined) return true;
  return (p.turnsTaken - p.masterBallLastUsedTurn) >= 10;
}
function renderItemsTab(){
  const p = state.players[state.currentPlayerIdx];
  const wrap = document.getElementById('tab-items');
  const atShop = p.zone===SHOP_ZONE;
  wrap.innerHTML = `
    <div class="row" style="margin-bottom:8px;">
      <button class="${itemsSubTab==='inventory'?'gold':''}" onclick="itemsSubTab='inventory'; renderItemsTab();">🎒 Meus Itens</button>
      <button class="${itemsSubTab==='shop'?'gold':''}" onclick="itemsSubTab='shop'; renderItemsTab();">🏪 Loja</button>
      <span style="margin-left:auto;">💰 ${p.gold}</span>
    </div>
    <div id="itemsSubContent"></div>
  `;
  const content = document.getElementById('itemsSubContent');
  if(itemsSubTab==='inventory'){
    const rows = Object.entries(p.items).filter(([k,v])=>v>0).map(([k,v])=>{
      const info = ITEMS[k];
      const canUse = info.type==='cura' && p.team.length>0 && !p.itemUsedThisTurn;
      const isMasterOnCooldown = k==='Master Ball' && !masterBallAvailable(p);
      return `<div class="row" style="justify-content:space-between; border-bottom:1px dashed #999; padding:4px 0;">
        <span>${k} x${v} <span class="small">(${info.desc})</span>${isMasterOnCooldown?' <span class="small">— em recarga</span>':''}</span>
        ${canUse ? `<button class="green" onclick="useItemPrompt('${k}')">Usar</button>` : ''}
      </div>`;
    }).join('');
    content.innerHTML = (p.itemUsedThisTurn ? '<p class="small">Você já usou um item neste turno.</p>' : '') + (rows || '<p class="small">Nenhum item. Visite a Loja para comprar.</p>');
  } else {
    if(!atShop){
      content.innerHTML = `<p class="small">🏪 Você precisa estar na zona da Loja (zona ${SHOP_ZONE}) para comprar itens. Vá até lá e volte nesta aba.</p>`;
    } else {
      content.innerHTML = Object.entries(ITEMS).map(([name,info])=>{
        const capped = name==='Master Ball' && (p.items[name]||0) >= (info.maxHeld||Infinity);
        return `<div class="shop-item">
          <span><b>${name}</b> — ${info.desc}</span>
          <span class="row"><span>💰 ${info.price}</span><button class="green" onclick="buyItem('${name}')" ${(p.gold<info.price||capped)?'disabled':''}>Comprar${capped?' (máx. 1)':''}</button></span>
        </div>`;
      }).join('');
    }
  }
}
function useItemPrompt(itemName){
  const p = state.players[state.currentPlayerIdx];
  if(p.itemUsedThisTurn){ alert('Você já usou um item neste turno.'); return; }
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='useItemModal';
  overlay.innerHTML = `<div class="box modal"><h2>Usar ${itemName} em qual pokémon?</h2>
    ${p.team.map((m,i)=>`<button style="display:block;width:100%;margin-bottom:6px;text-align:left;" onclick="applyItem('${itemName}',${i})">${m.name} — PV ${m.pv}/${m.pvMax}</button>`).join('')}
    <button class="red" onclick="document.getElementById('useItemModal').remove()">Cancelar</button>
  </div>`;
  document.body.appendChild(overlay);
}
function applyItem(itemName, idx){
  const p = state.players[state.currentPlayerIdx];
  if(p.itemUsedThisTurn){ alert('Você já usou um item neste turno.'); document.getElementById('useItemModal')?.remove(); return; }
  const mon = p.team[idx];
  const info = ITEMS[itemName];
  if(!(p.items[itemName]>0)) return;
  p.items[itemName]--;
  const heal = Math.round(mon.pvMax * info.pct);
  mon.pv = Math.min(mon.pvMax, mon.pv + heal);
  p.itemUsedThisTurn = true;
  logEvent(`${p.name} usou ${itemName} em ${mon.name} (+${heal} PV, agora com ${mon.pv}/${mon.pvMax}).`);
  document.getElementById('useItemModal')?.remove();
  renderItemsTab(); renderTeamTab();
}
function buyItem(name){
  const p = state.players[state.currentPlayerIdx];
  if(p.zone!==SHOP_ZONE) return;
  const info = ITEMS[name];
  if(p.gold<info.price) return;
  if(name==='Master Ball' && (p.items[name]||0) >= (info.maxHeld||Infinity)){ alert('Você só pode carregar 1 Master Ball por vez.'); return; }
  p.gold -= info.price;
  p.items[name] = (p.items[name]||0)+1;
  logEvent(`${p.name} comprou ${name} na loja por 💰${info.price}.`);
  state.shopUsedThisTurn = true;
  renderItemsTab();
  renderBoard();
}

/* =========================================================
   PAINEL FLUTUANTE ARRASTÁVEL (com atalhos numéricos)
   ========================================================= */
let panelPos = null;
function hostSkipDisconnectedTurn(){
  if(!isHostFlag) return;
  const p = state.players[state.currentPlayerIdx];
  if(!p.disconnected) return;
  logEvent(`${p.name} estava desconectado — o anfitrião pulou o turno dele.`, 'summary');
  endTurn();
}
function ensureFloatingPanel(){
  let panel = document.getElementById('floatingPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.id='floatingPanel';
    panel.innerHTML = `<div id="floatDragHandle" class="float-handle"><span>☰ Comandos</span><span class="small" style="color:#fff;">arraste</span></div><div id="floatButtons" class="float-buttons"></div>`;
    document.body.appendChild(panel);
    if(!panelPos) panelPos = {left: Math.max(10,window.innerWidth-260), top: 90};
    panel.style.left = panelPos.left+'px';
    panel.style.top = panelPos.top+'px';
    makeDraggable(panel, document.getElementById('floatDragHandle'));
  }
  return panel;
}
function makeDraggable(el, handle){
  let dragging=false, offX=0, offY=0;
  const start=(x,y)=>{ dragging=true; offX=x-el.offsetLeft; offY=y-el.offsetTop; };
  const move=(x,y)=>{ if(!dragging) return; panelPos={left:x-offX, top:y-offY}; el.style.left=panelPos.left+'px'; el.style.top=panelPos.top+'px'; };
  const end=()=>{ dragging=false; };
  handle.addEventListener('mousedown', e=>{ start(e.clientX,e.clientY); e.preventDefault(); });
  document.addEventListener('mousemove', e=>move(e.clientX,e.clientY));
  document.addEventListener('mouseup', end);
  handle.addEventListener('touchstart', e=>{ const t=e.touches[0]; start(t.clientX,t.clientY); }, {passive:true});
  document.addEventListener('touchmove', e=>{ const t=e.touches[0]; move(t.clientX,t.clientY); }, {passive:true});
  document.addEventListener('touchend', end);
}
/** monta lista de botões com atalho numérico automático (1,2,3...) */
function buildShortcutButtons(list){
  const map = {};
  let html = '';
  list.forEach((item,i)=>{
    const key = String(i+1);
    map[key] = item.fn;
    html += `<button class="${item.cls||''}" onclick="(${item.fn.toString()})()">${key}) ${item.label}</button>`;
  });
  numericShortcuts = map;
  return html;
}
function updateFloatingPanel(){
  const panel = ensureFloatingPanel();
  const wrap = document.getElementById('floatButtons');
  const p = state.players[state.currentPlayerIdx];
  if(p.isBot){
    numericShortcuts = {};
    wrap.innerHTML = `<p class="small center">🤖 ${p.name} está jogando...</p>`;
    return;
  }
  if(!amIInControl()){
    if(isHostFlag && p.disconnected){
      numericShortcuts = {'1': ()=>hostSkipDisconnectedTurn()};
      wrap.innerHTML = `<p class="small center">🔌 ${p.name} está desconectado.</p><button class="red" onclick="hostSkipDisconnectedTurn()">1) Pular turno dele</button>`;
      return;
    }
    numericShortcuts = {};
    wrap.innerHTML = `<p class="small center">⏳ Vez de ${p.name}${p.disconnected?' 🔌 (desconectado)':''}. Aguarde...</p>`;
    return;
  }
  let html = '';
  if(state.phase==='movement'){
    numericShortcuts = {'1':()=>beginMovement(false), '2':()=>confirmRunPrompt()};
    html += `<button onclick="beginMovement(false)">1) 🎲 Mover (1d6)</button>
             <button onclick="confirmRunPrompt()">2) 🏃 Correr (2d6)</button>`;
  } else if(state.phase==='moving'){
    numericShortcuts = {'1':()=>confirmMovementEarly()};
    const lastDir = state.moveHistory[state.moveHistory.length-1];
    const canUndo = {up:false,down:false,left:false,right:false};
    if(lastDir) canUndo[OPPOSITE_DIR[lastDir]] = true;
    const dirDisabled = (d)=> {
      if(state.stepsRemaining<=0 && !canUndo[d]) return 'disabled';
      if(!canUndo[d] && neighborZone(p.zone,d)===null) return 'disabled title="Borda do mapa — sem túnel aqui"';
      return '';
    };
    html += `<div class="center small">Passos restantes: <b>${state.stepsRemaining}</b>${state.moveHistory.length>0?' <span title="Pode retroceder para recuperar 1 passo">↩️</span>':''}</div>
      <div class="dpad">
        <div class="empty"></div><button class="dir" ${dirDisabled('up')} onclick="stepMove('up')">▲</button><div class="empty"></div>
        <button class="dir" ${dirDisabled('left')} onclick="stepMove('left')">◀</button>
        <div class="empty"></div>
        <button class="dir" ${dirDisabled('right')} onclick="stepMove('right')">▶</button>
        <div class="empty"></div><button class="dir" ${dirDisabled('down')} onclick="stepMove('down')">▼</button><div class="empty"></div>
      </div>
      <p class="small center">Setas ou WASD. Andar na direção contrária ao último passo recupera 1 movimento.</p>
      <button class="gold" onclick="confirmMovementEarly()">1) ✔️ Confirmar posição</button>`;
  } else if(state.phase==='action'){
    const map = {};
    let n=1;
    if(p.zone===CENTER_ZONE){
      html += `<button class="green" onclick="healAtCenter()">${n}) 🏥 Curar no Centro Pokémon (perde o turno)</button>`;
      map[String(n)]=healAtCenter; n++;
    } else if(p.zone===SHOP_ZONE){
      html += `<p class="small">🏪 Você está na Loja — use a aba "Itens & Loja" pra comprar. Não dá pra procurar pokémon aqui.</p>`;
    } else {
      html += `<button onclick="doSearch()">${n}) 🔍 Procurar Pokémon</button>`;
      map[String(n)]=doSearch; n++;
    }
    html += `<button onclick="tryChallenge()">${n}) ⚔️ Desafiar na zona</button>`;
    map[String(n)]=tryChallenge; n++;
    html += `<button class="gold" onclick="confirmEndTurn()">${n}) Encerrar turno</button>`;
    map[String(n)]=confirmEndTurn; n++;
    numericShortcuts = map;
  } else if(state.phase==='end'){
    numericShortcuts = {'1':()=>endTurn()};
    html += `<button class="gold" onclick="endTurn()">1) Encerrar turno</button>`;
  }
  wrap.innerHTML = html;
}

/* =========================================================
   MOVIMENTO
   ========================================================= */
function beginMovement(running){
  const p = state.players[state.currentPlayerIdx];
  const steps = running ? rollDiceShow(6,2,`${p.name} — Correr`) : rollDiceShow(6,1,`${p.name} — Mover`);
  state.stepsRemaining = steps;
  state.running = running;
  state.moveHistory = [];
  state.phase = 'moving';
  if(running) logEvent(`${p.name} decidiu correr! Pode andar até ${steps} casas, mas sem ação padrão neste turno.`);
  else logEvent(`${p.name} pode andar até ${steps} casa(s). Use as setas/WASD para escolher a direção.`);
  renderGame();
}
function confirmRunPrompt(){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='runConfirmModal';
  numericShortcuts = {
    '1': ()=>{ document.getElementById('runConfirmModal').remove(); beginMovement(true); },
    '2': ()=>{ document.getElementById('runConfirmModal').remove(); updateFloatingPanel(); }
  };
  overlay.innerHTML = `
    <div class="box modal">
      <h2>🏃 Confirmar Correr</h2>
      <p>Ao Correr você anda o dobro (2d6), mas <b>gasta seu turno inteiro</b> — não terá Ação Padrão depois.</p>
      <div class="row">
        <button class="green" onclick="document.getElementById('runConfirmModal').remove(); beginMovement(true);">1) Sim, quero correr</button>
        <button class="red" onclick="document.getElementById('runConfirmModal').remove(); updateFloatingPanel();">2) Cancelar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}
const OPPOSITE_DIR = {up:'down', down:'up', left:'right', right:'left'};
function stepMove(dir){
  const p = state.players[state.currentPlayerIdx];
  const newZone = neighborZone(p.zone, dir);
  if(newZone===null){
    logEvent(`${p.name} bateu na borda do mapa e não conseguiu atravessar (só dá pra atravessar por um túnel 🌀).`);
    showBigMessage(`🧱 Borda do mapa! Procure um túnel 🌀.`, 'bad');
    renderGame();
    return;
  }
  const lastDir = state.moveHistory[state.moveHistory.length-1];
  const isUndo = lastDir && OPPOSITE_DIR[dir]===lastDir;
  p.zone = newZone;
  if(isUndo){
    state.moveHistory.pop();
    state.stepsRemaining++;
    logEvent(`${p.name} retrocedeu, recuperando 1 movimento (voltou para a zona ${newZone}).`);
  } else {
    state.moveHistory.push(dir);
    state.stepsRemaining--;
    p.zonesVisited.add(newZone);
    checkVisitMissions(p);
    logEvent(`${p.name} andou para ${dir==='up'?'cima':dir==='down'?'baixo':dir==='left'?'esquerda':'direita'}, chegando na zona ${newZone} (${themeOfZone(newZone).name}).`);
  }
  renderGame();
  const token = document.getElementById('tokenP'+p.id);
  if(token) token.classList.add('anim-hop');
}
function confirmMovementEarly(){
  const p = state.players[state.currentPlayerIdx];
  logEvent(`${p.name} decidiu parar de andar (${state.stepsRemaining} passo(s) não usados).`);
  state.stepsRemaining = 0;
  state.moveHistory = [];
  state.phase = state.running ? 'end' : 'action';
  renderGame();
}

/* =========================================================

   ========================================================= */
function relocateSpecialZone(exclude1, exclude2){
  let z;
  let tries=0;
  do{ z = Math.floor(Math.random()*TOTAL_ZONES)+1; tries++; } while((z===exclude1 || z===exclude2) && tries<50);
  return z;
}
function healAtCenter(){
  const p = state.players[state.currentPlayerIdx];
  p.team.slice(0,MAX_ACTIVE).forEach(m=> m.pv = m.pvMax);
  let newZone;
  do{ newZone = rollDiceShow(TOTAL_ZONES,1,`Novo terreno de ${p.name} após curar`); } while(newZone===CENTER_ZONE && TOTAL_ZONES>1);
  p.zone = newZone;
  p.zonesVisited.add(newZone);
  checkVisitMissions(p);
  const oldCenter = CENTER_ZONE;
  CENTER_ZONE = relocateSpecialZone(oldCenter, SHOP_ZONE);
  logEvent(`${p.name} curou seus pokémons principais no Centro Pokémon e foi transportado para a zona ${newZone}. O Centro Pokémon também mudou de lugar (agora é na zona ${CENTER_ZONE}).`);
  showBigMessage(`💊 Time curado no Centro Pokémon! Ele mudou de lugar.`, 'good');
  state.phase='end';
  renderGame();
}

/* =========================================================
   PROCURAR / CAPTURAR
   ========================================================= */
function bestOwnedRarityIndex(p){
  if(p.team.length===0) return 0;
  const idxs = p.team.map(m=>RARITY_ORDER.indexOf(m.rarity));
  return Math.max(...idxs);
}
function doSearch(){
  const p = state.players[state.currentPlayerIdx];
  const findRoll = rollDiceShow(10,1,`${p.name} — Chance de encontro (80%)`);
  const found = findRoll <= 8;
  if(!found){
    logEvent(`${p.name} procurou na zona ${p.zone} mas não encontrou nenhum pokémon.`);
    state.phase='end'; renderGame(); return;
  }
  const theme = themeOfZone(p.zone);
  const eventHere = state.eventActive && theme.types.some(t=>typeCategory(t)===state.eventActive);
  const roll20 = rollDiceShow(20,1,`${p.name} — Raridade do encontro`);
  let rarity;
  if(eventHere){
    rarity = roll20<=7 ? "Muito comum" : roll20<=13 ? "Comum" : roll20<=17 ? "Incomum" : "Raro";
  } else {
    rarity = roll20<=8 ? "Muito comum" : roll20<=15 ? "Comum" : "Incomum";
  }
  const cap = Math.min(RARITY_ORDER.length-1, bestOwnedRarityIndex(p)+1);
  let idx = Math.min(RARITY_ORDER.indexOf(rarity), cap);
  rarity = RARITY_ORDER[idx];

  let candidates = POKEDEX.filter(d=> d.rarity===rarity && (d.terrains.length===0 || d.terrains.includes(theme.id)));
  if(eventHere){
    const legendRoll = rollDiceShow(20,1,`${p.name} — Chance de Lendário (evento)`);
    if(legendRoll===20){
      const legend = POKEDEX.find(d=>d.rarity==="Lendário" && d.eventType===state.eventActive);
      if(legend) candidates = [legend];
    }
  }
  if(candidates.length===0) candidates = POKEDEX.filter(d=>d.rarity===rarity);
  const dex = pick(candidates);
  const instance = newPokemonInstance(dex);
  const targetLevel = Math.max(1, (p.team[0] ? p.team[0].level : 1) - 1);
  if(targetLevel>1) syntheticLevelUp(instance, targetLevel);
  state.encounter = {dex, instance, playerIdx: state.currentPlayerIdx};
  logEvent(`${p.name} encontrou um ${dex.name} (${dex.rarity}) na zona ${p.zone}!`);
  if(p.isBot) botHandleEncounter(p);
  else renderEncounterModal();
}
function captureRoll(rarity, ballBonus){
  let success = false;
  switch(rarity){
    case "Muito comum": { const d=rollDiceShow(2,1,"Captura (Muito comum)"); success = d%2===0; break; }
    case "Comum": { const d=rollDiceShow(2,1,"Captura (Comum)"); success = d%2===1; break; }
    case "Incomum": { const d=rollDiceShow(10,1,"Captura (Incomum)"); success = [1,4,6].includes(d); break; }
    case "Raro": { const d=rollDiceShow(12,1,"Captura (Raro)"); success = [1,9,10].includes(d); break; }
    case "Muito raro": { const d=rollDiceShow(20,1,"Captura (Muito raro)"); success = [1,9,10,15].includes(d); break; }
    case "Épico": { const d=rollDiceShow(20,1,"Captura (Épico)"); success = [5,10,15].includes(d); break; }
    case "Lendário": { const d=rollDiceShow(12,1,"Captura (LENDÁRIO)"); success = d===12; break; }
  }
  if(success) return true;
  if(ballBonus>0){
    const pct = Math.round(ballBonus*100);
    const bonusRoll = rollDiceShow(100,1,`Chance bônus da bola (+${pct}%)`);
    if(bonusRoll<=pct) return true;
  }
  return false;
}
function renderEncounterModal(){
  const {dex, instance} = state.encounter;
  const p = state.players[state.currentPlayerIdx];
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='encounterModal';
  const ballsOwned = Object.entries(ITEMS).filter(([k,v])=> (v.type==='bola'||v.type==='master') && p.items[k]>0);

    const key = String(n);
    if(!disabled) map[key] = ()=>attemptCapture(name);
    n++;
    return `<button class="green" onclick="attemptCapture('${name}')" ${disabled?'disabled':''}>${key}) ${label}</button>`;
  }).join('');
  const battleKey = String(n); map[battleKey] = ()=>startPVE(); n++;
  const ignoreKey = String(n); map[ignoreKey] = ()=>closeEncounter();

      <div class="small" style="margin-top:6px;">💪 Força ${instance.atk} · 🛡️ Defesa ${instance.def} · ⚡ Velocidade ${instance.vel} · ❤️ Vida ${instance.pvMax}</div>
      <div class="small">${(()=>{ const evoLvl=RARITY_INFO[dex.rarity].evoLevel; const nextName = dex.name==='Eevee' ? 'Vaporeon/Jolteon/Flareon' : EVOLUTION_MAP[dex.name]; return (evoLvl && nextName) ? `🧬 Evolui no nível ${evoLvl}, vira ${nextName} (nível atual: ${instance.level})` : '🧬 Não evolui'; })()}</div>
      <div class="row" style="margin-top:10px; flex-direction:column; align-items:stretch;">
        ${ballButtons || '<p class="small">Você não tem nenhuma Pokébola.</p>'}

function closeEncounter(){
  document.getElementById('encounterModal')?.remove();
  state.phase='end';
  renderGame();
}
function attemptCapture(ballName){
  const p = state.players[state.currentPlayerIdx];
  const {dex} = state.encounter;
  const ballInfo = ITEMS[ballName];
  if(!(p.items[ballName]>0)) return;
  p.items[ballName]--;
  const modal = document.getElementById('encounterModal');
  if(modal) modal.classList.add('anim-shake');
  setTimeout(()=>{
    let success;
    if(ballName==='Master Ball'){
      success = true;
      p.masterBallLastUsedTurn = p.turnsTaken;
      logEvent(`${p.name} usou uma Master Ball — captura garantida!`);
    } else {
      success = captureRoll(dex.rarity, ballInfo.bonus);
    }
    if(success){
      const mon = state.encounter.instance;
      p.team.push(mon);
      processMissionEvent(p, 'capture', {types:dex.types, rarity:dex.rarity});
      logEvent(`${p.name} capturou ${dex.name}!${p.team.length>MAX_ACTIVE?' Foi para a mochila.':''}`);
      showBigMessage(`🎉 ${p.name} capturou ${dex.name}!`, 'good');
      if(LEGENDARY_NAMES.includes(dex.name)) checkLegendariesComplete();
    } else {
      logEvent(`${p.name} tentou capturar ${dex.name} com ${ballName}, mas fugiu.`);
      showBigMessage(`😢 ${dex.name} fugiu da captura!`, 'bad');
    }
    closeEncounter();
  }, 450);
}
function checkLegendariesComplete(){
  const capturedLegendaries = new Set();
  state.players.forEach(p=>p.team.forEach(m=>{ if(LEGENDARY_NAMES.includes(m.name)) capturedLegendaries.add(m.name); }));
  if(LEGENDARY_NAMES.every(n=>capturedLegendaries.has(n))){
    logEvent(`🏆 Todos os lendários foram capturados! Iniciando a batalha final PVP...`);
    startFinalBracket();
  }
}

/* =========================================================
   BATALHA — cada lado usa até 3 pokémon em sequência
   ========================================================= */
function activeOf(side){ return side.team[side.currentIndex]; }
function tryAdvance(side){
  const before = side.currentIndex;
  while(side.currentIndex < side.team.length && side.team[side.currentIndex].pv<=0){ side.currentIndex++; }
  if(side.currentIndex < side.team.length){
    if(side.currentIndex !== before){
      side.team[side.currentIndex].speedAccum = side.team[side.currentIndex].vel;
    }
    return true;
  }
  return false;
}
function sideHasFighter(p){ return p.team.slice(0,MAX_ACTIVE).some(m=>m.pv>0); }

function startPVE(){
  document.getElementById('encounterModal')?.remove();
  const p = state.players[state.currentPlayerIdx];
  if(!sideHasFighter(p)){ if(!p.isBot) alert(`Todos os seus pokémons principais estão desmaiados. Cure-os antes de batalhar.`); state.phase='end'; renderGame(); return; }
  const enemy = state.encounter.instance;
  const sideA = {player:p, team: p.team.slice(0,MAX_ACTIVE), currentIndex:0};
  const sideB = {player:null, team: [enemy], currentIndex:0};
  tryAdvance(sideA); tryAdvance(sideB);
  runBattle({type:'PVE', a:sideA, b:sideB});
}

let pendingChallenge = null;
function tryChallenge(){
  const p = state.players[state.currentPlayerIdx];
  const sameZone = state.players.filter(o=>o.id!==p.id && !o.eliminated && o.zone===p.zone);
  const others = sameZone.filter(o=> !(o.challengeImmuneUntilTurn && o.turnsTaken < o.challengeImmuneUntilTurn));
  if(sameZone.length>0 && others.length===0){
    if(!p.isBot) alert(`${sameZone[0].name} está protegido contra desafios (foi desafiado recentemente).`);
    return;
  }
  if(others.length===0){ if(!p.isBot) alert("Não há outro jogador nesta zona."); return; }
  const target = others[0];
  if(!sideHasFighter(target)){ if(!p.isBot) alert(`${target.name} não tem pokémons saudáveis para batalhar.`); return; }
  if(!sideHasFighter(p)){ if(!p.isBot) alert(`Seus pokémons principais estão todos desmaiados.`); return; }
  pendingChallenge = {challenger:p, target};
  target.challengeImmuneUntilTurn = target.turnsTaken + 3;
  logEvent(`${target.name} fica protegido contra novos desafios pelas próximas 3 rodadas dele.`);
  if(target.isBot){
    logEvent(`${p.name} desafiou ${target.name}!`);
    setTimeout(()=>respondChallenge(true), 500);
    return;
  }
  if(onlineMode){
    state.pendingChallengeInfo = {challengerId:p.id, targetId:target.id, deadline: Date.now()+30000, challengerName:p.name, targetName:target.name};
    logEvent(`${p.name} desafiou ${target.name}! ${target.name} tem 30 segundos pra responder.`);
    renderGame();
    if(challengeTimer) clearTimeout(challengeTimer);
    challengeTimer = setTimeout(()=>{ if(pendingChallenge){ logEvent(`Tempo esgotado — desafio aceito automaticamente.`); respondChallenge(true); } }, 30500);
    return;
  }
  showLocalChallengeModal(p, target);
}
function showLocalChallengeModal(p, target){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='challengeModal';
  numericShortcuts = { '1': ()=>respondChallenge(true), '2': ()=>respondChallenge(false) };
  overlay.innerHTML = `
    <div class="box modal">
      <h2>⚔️ Desafio PVP!</h2>
      <p>${p.name} desafia <b>${target.name}</b> para uma batalha (3 vs 3)! ${target.name}, você aceita?</p>
      <div class="row">
        <button class="green" onclick="respondChallenge(true)">1) Aceitar</button>
        <button class="red" onclick="respondChallenge(false)">2) Recusar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function respondChallenge(accepted){
  document.getElementById('challengeModal')?.remove();
  if(challengeTimer){ clearTimeout(challengeTimer); challengeTimer=null; }
  if(onlineMode) state.pendingChallengeInfo = null;
  const {challenger, target} = pendingChallenge;
  if(!accepted){
    showBigMessage(`🚫 ${target.name} recusou o desafio!`, 'bad');
    const d1=rollDiceShow(6,1,`Disputa de recusa — ${challenger.name}`), d2=rollDiceShow(6,1,`Disputa de recusa — ${target.name}`);
    logEvent(`${target.name} recusou o desafio. Disputa: ${challenger.name} tirou ${d1}, ${target.name} tirou ${d2}.`);
    if(d1<=d2){ logEvent(`${target.name} venceu a disputa e a batalha não ocorre.`); state.phase='end'; renderGame(); return; }
    logEvent(`${challenger.name} venceu a disputa — a batalha ocorre mesmo assim!`);
  } else {
    logEvent(`${target.name} aceitou o desafio!`);
  }
  const sideA = {player:challenger, team: challenger.team.slice(0,MAX_ACTIVE), currentIndex:0};
  const sideB = {player:target, team: target.team.slice(0,MAX_ACTIVE), currentIndex:0};
  tryAdvance(sideA); tryAdvance(sideB);
  runBattle({type:'PVP', a:sideA, b:sideB});
}

function runBattle(battle){
  battle.turn = 1;
  battle.log = [];
  state.activeBattle = battle;
  renderBattleModal();
}
function battleAdvantageMultiplier(attackerCat, defenderCat){
  const list = ADVANTAGE[attackerCat];
  return (list && list.includes(defenderCat)) ? 1.5 : 1;
}
function battleMatchupText(aMon, bMon){
  const aAdv = battleAdvantageMultiplier(aMon.category, bMon.category) > 1;
  const bAdv = battleAdvantageMultiplier(bMon.category, aMon.category) > 1;
  if(aAdv && !bAdv) return `🔺 <b>${aMon.name}</b> tem VANTAGEM de tipo contra ${bMon.name} (dano x1.5)!`;
  if(bAdv && !aAdv) return `🔻 <b>${bMon.name}</b> tem VANTAGEM de tipo contra ${aMon.name} (dano x1.5)!`;
  if(aAdv && bAdv) return `⚔️ Vantagem cruzada — ambos causam x1.5 de dano um no outro!`;
  return `➖ Sem vantagem de tipo neste confronto.`;
}
function getHumanSide(b){
  const aMon0=activeOf(b.a), bMon0=activeOf(b.b);
  const first = aMon0.speedAccum>=bMon0.speedAccum? b.a : b.b;
  const second = first===b.a? b.b : b.a;
  return first.player? first : (second.player? second : first);
}

function performSwitch(switchIdx){
  const b = state.activeBattle;
  const humanSide = getHumanSide(b);
  const oppSide = humanSide===b.a ? b.b : b.a;
  const oldMon = activeOf(humanSide);
  const cur = humanSide.currentIndex;
  const tmp = humanSide.team[cur];
  humanSide.team[cur] = humanSide.team[switchIdx];
  humanSide.team[switchIdx] = tmp;
  const newMon = activeOf(humanSide);
  b.log.push(`${humanSide.player.name} trocou ${oldMon.name} por ${newMon.name}!`);
  newMon.speedAccum = newMon.vel;
  if(activeOf(oppSide)) activeOf(oppSide).speedAccum = activeOf(oppSide).vel;
  if(activeOf(oppSide) && activeOf(oppSide).pv>0 && newMon.pv>0){
    const att = activeOf(oppSide), def = newMon;
    const r1 = rollDiceShow(20,1,`${att.name} aproveita a troca e ataca (+${att.atk})`) + att.atk;
    const r2 = rollDiceShow(20,1,`${def.name} defende (+${def.def})`) + def.def;
    if(r1>r2){
      let dmg = r1-r2;
      const mult = battleAdvantageMultiplier(att.category, def.category);
      dmg = Math.round(dmg*mult);
      def.pv = Math.max(0, def.pv - dmg);
      b.log.push(`${att.name} atacou ${def.name} durante a troca e causou ${dmg} de dano${mult>1?' (vantagem de tipo x1.5!)':''}.`);
      const el = document.getElementById(humanSide===b.a?'battleSideA':'battleSideB');
      if(el){ el.classList.add('anim-shake'); setTimeout(()=>el.classList.remove('anim-shake'),400); }
      if(def.pv<=0){
        b.log.push(`${def.name} desmaiou!`);
        const hasMore = tryAdvance(humanSide);
        if(hasMore) b.log.push(`${humanSide.player.name} enviou ${activeOf(humanSide).name} para a batalha!`);
      }
    } else {
      b.log.push(`${att.name} tentou aproveitar a troca mas ${def.name} esquivou!`);
    }
  }
  const aDefeated = !tryAdvance(b.a) && (!activeOf(b.a) || activeOf(b.a).pv<=0);
  const bDefeated = !tryAdvance(b.b) && (!activeOf(b.b) || activeOf(b.b).pv<=0);
  if(aDefeated || bDefeated){
    const winner = aDefeated && bDefeated ? null : (aDefeated ? b.b : b.a);
    finishBattle(winner);
    return;
  }
  b.turn++;
  renderBattleModal();
}

function battleAction(action, itemName){
  const b = state.activeBattle;
  const aMon0 = activeOf(b.a), bMon0 = activeOf(b.b);
  const first = aMon0.speedAccum >= bMon0.speedAccum ? b.a : b.b;
  const second = first===b.a ? b.b : b.a;
  const humanSide = first.player ? first : (second.player ? second : first);

  if(action==='item' && !itemName){ openBattleItemPicker(humanSide); return; }

  function flashHit(side){
    const el = document.getElementById(side===b.a?'battleSideA':'battleSideB');
    if(el){ el.classList.add('anim-shake'); setTimeout(()=>el.classList.remove('anim-shake'),400); }
  }
  function doAttack(attSide, defSide){
    if(!activeOf(attSide) || activeOf(attSide).pv<=0) return;
    if(!activeOf(defSide) || activeOf(defSide).pv<=0) return;
    const att = activeOf(attSide), def = activeOf(defSide);
    const r1 = rollDiceShow(20,1,`${att.name} ataca (+${att.atk})`) + att.atk;
    const r2 = rollDiceShow(20,1,`${def.name} defende (+${def.def})`) + def.def;
    if(r1>r2){
      let dmg = r1-r2;
      const mult = battleAdvantageMultiplier(att.category, def.category);
      dmg = Math.round(dmg*mult);
      def.pv = Math.max(0, def.pv - dmg);
      b.log.push(`${att.name} atacou ${def.name} e causou ${dmg} de dano${mult>1?' (vantagem de tipo x1.5!)':''}.`);
      flashHit(defSide);
      if(def.pv<=0){
        b.log.push(`${def.name} desmaiou!`);
        const hasMore = tryAdvance(defSide);
        if(hasMore) b.log.push(`${defSide.player?defSide.player.name:'A natureza'} enviou ${activeOf(defSide).name} para a batalha!`);
      }
    } else {
      b.log.push(`${att.name} atacou mas ${def.name} esquivou!`);
    }
  }

  if(action==='attack'){
    doAttack(first, second);
    if(activeOf(second) && activeOf(second).pv>0 && activeOf(first) && activeOf(first).pv>0 && activeOf(first).speedAccum >= 2*activeOf(second).speedAccum){
      b.log.push(`${activeOf(first).name} é rápido o bastante para atacar novamente!`);
      doAttack(first, second);
    }
  } else if(action==='item'){
    const p = humanSide.player;
    if(p && p.itemUsedThisTurn){
      b.log.push(`${p.name} já usou um item neste turno.`);
    } else if(p && p.items[itemName]>0){
      p.items[itemName]--;
      p.itemUsedThisTurn = true;
      const mon = activeOf(humanSide);
      const heal = Math.round(mon.pvMax * ITEMS[itemName].pct);
      mon.pv = Math.min(mon.pvMax, mon.pv+heal);
      b.log.push(`${p.name} usou ${itemName} em ${mon.name} (+${heal} PV).`);
    } else {
      b.log.push(`Sem itens disponíveis.`);
    }
  } else if(action==='flee'){
    const fled = rollDiceShow(2,1,`Tentativa de fuga`)===1;
    if(fled){ b.log.push(`${humanSide.player?humanSide.player.name:'Alguém'} fugiu da batalha.`); finishBattle(null); return; }
    else { b.log.push(`A fuga falhou!`); doAttack(second, first); }
  }
  if(action!=='flee'){
    if(activeOf(second) && activeOf(second).pv>0 && activeOf(first) && activeOf(first).pv>0){
      doAttack(second, first);
      if(activeOf(first) && activeOf(first).pv>0 && activeOf(second) && activeOf(second).pv>0 && activeOf(second).speedAccum >= 2*activeOf(first).speedAccum){
        doAttack(second, first);
      }
    }
  }

  const aDefeated = !tryAdvance(b.a) && (!activeOf(b.a) || activeOf(b.a).pv<=0);
  const bDefeated = !tryAdvance(b.b) && (!activeOf(b.b) || activeOf(b.b).pv<=0);
  if(aDefeated || bDefeated){
    const winner = aDefeated && bDefeated ? null : (aDefeated ? b.b : b.a);
    finishBattle(winner);
    return;
  }
  b.turn++;
  activeOf(b.a).speedAccum += activeOf(b.a).vel;
  activeOf(b.b).speedAccum += activeOf(b.b).vel;
  renderBattleModal();
}

function getParticipants(side){
  const cappedEnd = side.currentIndex >= side.team.length ? side.team.length-1 : side.currentIndex;
  return side.team.slice(0, cappedEnd+1);
}
/** Distribui XP entre os pokémons do lado vencedor seguindo a regra original:
    o pokémon que decidiu a batalha leva 60%, e o restante (40%) é dividido
    igualmente entre os outros pokémons que também lutaram. Se só um lutou, leva 100%. */
function distributeBattleXP(winnerSide, totalXP, player){
  const participants = getParticipants(winnerSide);
  const winMon = participants[participants.length-1];
  const others = participants.slice(0,-1);
  if(others.length===0){
    gainXP(winMon, totalXP, player);
    logEvent(`${winMon.name} venceu sozinho e ganhou ${totalXP} XP!`);
    return {winMonName:winMon.name, winXP:totalXP, othersXP:[]};
  }
  const winXP = Math.round(totalXP*0.6);
  const remaining = totalXP - winXP;
  const share = Math.round(remaining/others.length);
  gainXP(winMon, winXP, player);
  logEvent(`${winMon.name} decidiu a batalha e ganhou ${winXP} XP (60%)!`);
  const othersXP = others.map(m=>{
    gainXP(m, share, player);
    logEvent(`${m.name} também lutou nessa batalha e ganhou ${share} XP.`);
    return {name:m.name, xp:share};
  });
  return {winMonName:winMon.name, winXP, othersXP};
}
function finishBattle(winnerSide){
  const b = state.activeBattle;
  document.getElementById('battleModal')?.remove();
  const loserSide = winnerSide===b.a ? b.b : (winnerSide===b.b ? b.a : null);
  const aFaintedCount = b.a.team.slice(0,MAX_ACTIVE).filter(m=>m.pv<=0).length;
  const bFaintedCount = b.b.team.slice(0,MAX_ACTIVE).filter(m=>m.pv<=0).length;
  const roundsFought = b.turn;
  let xpAwarded = 0, winMonName = '', loserGoldLost = 0, othersXP = [];
  if(winnerSide && winnerSide.player){
    const xp = (b.type==='PVP'||b.type==='PVP-FINAL') ? 250 : RARITY_INFO[state.encounter ? state.encounter.dex.rarity : "Comum"].xpPVE;
    const result = distributeBattleXP(winnerSide, xp, winnerSide.player);
    xpAwarded = xp; winMonName = result.winMonName; othersXP = result.othersXP;
    showBigMessage(`🏆 ${winnerSide.player.name} venceu a batalha!`, 'good');
    if(b.type==='PVP'||b.type==='PVP-FINAL'){
      winnerSide.player.pvpWins = (winnerSide.player.pvpWins||0)+1;
      processMissionEvent(winnerSide.player, 'pvp_win');
    }
    if(b.type==='PVE'){
      winnerSide.player.gold += 5;
      logEvent(`${winnerSide.player.name} ganhou 💰5 de gold por derrotar o pokémon selvagem.`);
      processMissionEvent(winnerSide.player, 'pve_win');
    }
  }
  if(loserSide && loserSide.player){
    const p = loserSide.player;
    if(b.type==='PVP' || b.type==='PVP-FINAL'){
      loserGoldLost = p.gold - Math.floor(p.gold*0.5);
      p.gold = Math.floor(p.gold*0.5);
      logEvent(`${p.name} perdeu 50% do gold por ser derrotado em PVP.`);
    } else {
      logEvent(`${p.name} foi derrotado pelo pokémon selvagem, mas não perde gold.`);
    }
    if(b.type==='PVP'){
      p.zone = CENTER_ZONE;
      p.zonesVisited.add(CENTER_ZONE);
      p.team.slice(0,MAX_ACTIVE).forEach(m=>{ m.pv = m.pvMax; });
      logEvent(`${p.name} foi levado ao Centro Pokémon (zona ${CENTER_ZONE}) e teve seus 3 pokémons principais curados por completo.`);
    } else {
      p.zone = rollDiceShow(TOTAL_ZONES,1,`Zona de reaparecimento de ${p.name}`);
      if(p.team[0]){ p.team[0].pv = Math.max(1, Math.round(p.team[0].pvMax*0.25)); }
      logEvent(`${p.name} renasceu na zona ${p.zone}. Só ${p.team[0]?p.team[0].name:'o pokémon do slot 1'} voltou, com 25% de vida.`);
    }
    showBigMessage(`💫 ${p.name} foi derrotado e renasceu!`, 'bad');
  } else if(!winnerSide){
    logEvent(`A batalha terminou sem vencedor definido (fuga).`);
  }
  state.activeBattle = null;
  state.encounter = null;
  state.phase='end';
  renderGame();
  if(b.type==='PVP' && winnerSide && loserSide && winnerSide.player && loserSide.player){
    showBattleSummaryModal({
      winnerName: winnerSide.player.name, winMonName, xp: xpAwarded, othersXP,
      aName: b.a.player.name, bName: b.b.player.name,
      aFainted: aFaintedCount, bFainted: bFaintedCount,
      aTotal: b.a.team.slice(0,MAX_ACTIVE).length, bTotal: b.b.team.slice(0,MAX_ACTIVE).length,
      rounds: roundsFought, loserName: loserSide.player.name, goldLost: loserGoldLost
    });
  }
}

function buildTurnSummary(p, entries){
  const captured = entries.filter(e=>e.msg.includes('capturou')).length;
  const evolved = entries.filter(e=>e.msg.includes('evoluiu para')).length;
  const wonBattle = entries.some(e=>e.msg.includes('venceu a batalha'));
  const lostBattle = entries.some(e=>e.msg.includes('renasceu na zona'));
  const bought = entries.filter(e=>e.msg.includes('comprou')).length;
  const missionDone = entries.filter(e=>e.msg.includes('completou a missão')).length;
  const healed = entries.some(e=>e.msg.includes('Centro Pokémon') && e.msg.includes('curou'));
  const challenged = entries.some(e=>e.msg.includes('desafiou'));
  const parts = [`${p.name} terminou o turno na zona ${p.zone}`];
  if(captured>0) parts.push(`capturou ${captured} pokémon(s)`);
  if(evolved>0) parts.push(`evoluiu ${evolved} pokémon(s)`);
  if(wonBattle) parts.push(`venceu uma batalha`);
  if(lostBattle) parts.push(`foi derrotado`);
  if(challenged && !wonBattle && !lostBattle) parts.push(`lançou um desafio PVP`);
  if(bought>0) parts.push(`comprou ${bought} item(ns)`);
  if(missionDone>0) parts.push(`completou ${missionDone} missão(ões)`);
  if(healed) parts.push(`curou o time no Centro Pokémon`);
  parts.push(`💰${p.gold}`);
  return parts.join(' · ');
}
function endTurn(){
  const endingPlayer = state.players[state.currentPlayerIdx];
  const turnEntries = state.history.filter(h=>h.turn===state.turnCount && h.type!=='summary');
  logEvent(buildTurnSummary(endingPlayer, turnEntries), 'summary');
  if(state.shopUsedThisTurn){
    const oldShop = SHOP_ZONE;
    SHOP_ZONE = relocateSpecialZone(oldShop, CENTER_ZONE);
    logEvent(`A Loja foi usada neste turno e mudou de lugar! Agora fica na zona ${SHOP_ZONE}.`);
    showBigMessage(`🏪 A Loja mudou de lugar!`, 'good');
    state.shopUsedThisTurn = false;
  }
  let idx = state.currentPlayerIdx;
  do{ idx = (idx+1) % state.players.length; } while(state.players[idx].eliminated);
  if(idx <= state.currentPlayerIdx){
    state.round++;
    if(state.eventActive){
      state.eventRoundsLeft--;
      if(state.eventRoundsLeft<=0){
        logEvent(`O evento de tipo ${state.eventActive} terminou.`);
        state.eventActive=null;
        state.eventCountdown = EVENT_INTERVAL - EVENT_DURATION;
      }
    } else {
      state.eventCountdown--;
      if(state.eventCountdown<=0){
        state.eventActive = pick(EVENT_CATEGORIES);
        state.eventRoundsLeft = EVENT_DURATION;
        logEvent(`🌟 Novo evento: pokémons do tipo ${state.eventActive} estão em alta em suas regiões!`);
        showBigMessage(`🌟 O evento de ${state.eventActive} começou!`, 'good');
        state.players.forEach(p=>processMissionEvent(p, 'event_participate'));
      }
    }
  }
  state.currentPlayerIdx = idx;
  state.turnCount++;
  state.phase='movement';
  const nextPlayer = state.players[idx];
  nextPlayer.turnsTaken = (nextPlayer.turnsTaken||0)+1;
  nextPlayer.itemUsedThisTurn = false;
  if(onlineMode){
    netSend({type:'state', payload: serializeState()}); // transmite mesmo já não estando mais no controle
    lastSeenTurnOwner = nextPlayer.id;
    myTurnStarted = false;
    renderGame();
  } else {
    showPassScreen();
  }
}
