  }
}
function isConnectionHealthy(){ return !onlineMode || fbConnectedFlag; }
function updateConnectionBadge(){
  if(!onlineMode){ document.getElementById('connBadge')?.remove(); return; }
  let badge = document.getElementById('connBadge');
  if(!badge){
    badge = document.createElement('div');
    badge.id = 'connBadge';
    badge.style.cssText = 'position:fixed; top:8px; left:8px; z-index:90; padding:6px 10px; border-radius:4px; font-family:"VT323",monospace; font-size:15px; border:2px solid #1c1408; box-shadow:2px 2px 0 rgba(0,0,0,.4);';
    document.body.appendChild(badge);
  }
  if(isConnectionHealthy()){
    badge.style.background = '#3a9d5d'; badge.style.color = '#fff';
    badge.innerHTML = '🟢 Online';
  } else {
    badge.style.background = '#c0392b'; badge.style.color = '#fff';
    badge.innerHTML = '🔴 Sem conexão — reconectando sozinho...';
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && onlineMode) setTimeout(updateConnectionBadge, 300);
});

function genRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}
function amIInControl(){
  if(!onlineMode) return true;
  if(!state || !state.players || state.players.length===0) return true;
  return state.players[state.currentPlayerIdx].id === myPlayerId;
}
/** Marca automaticamente o jogador como desconectado no banco se a conexão cair de qualquer jeito
    (fechar a aba, perder internet, app matar o processo) — funciona mesmo sem aviso prévio. */
function setupPresence(playerIndex){
  if(playerIndex==null || playerIndex<0 || !roomRef) return;
  roomRef.child(`state/players/${playerIndex}/disconnected`).onDisconnect().set(true);
}
function broadcastStateIfNeeded(){
  if(!onlineMode || !roomRef) return;
  if(!amIInControl()) return; // só quem está no turno manda o estado durante o jogo normal
  const payload = JSON.parse(JSON.stringify(state, (k,v)=> v instanceof Set ? Array.from(v) : v));
  payload.__mapMeta = { GRID_SIZE, TOTAL_ZONES, CENTER_ZONE, SHOP_ZONE, TUNNEL_ZONES: Array.from(TUNNEL_ZONES) };
  roomRef.child('state').set(payload);
}
function applyRemoteState(obj){
  restoreMapMeta(obj);
  obj.players.forEach(p=>{ p.zonesVisited = new Set(p.zonesVisited||[]); });
  const isFirstLoad = (myPlayerId===null);
  state = obj;
  if(isFirstLoad){
    const idx = state.players.findIndex(p=>p.token===myToken);
    if(idx>=0){ myPlayerId = state.players[idx].id; setupPresence(idx); }
  }
  document.getElementById('screen-setup').classList.add('hidden');
  document.getElementById('screen-game').classList.remove('hidden');
  if(state.gameOver) renderEndgame(); else renderGame();
}
function attachStateListener(){
  if(stateListenerAttached) return;
  stateListenerAttached = true;
  roomRef.child('state').on('value', snap=>{
    const val = snap.val();
    if(val) applyRemoteState(val);
  });
  roomRef.child('challengeResponse').on('value', snap=>{
    const val = snap.val();
    if(val && pendingChallenge && amIInControl()){
      respondChallenge(val.accepted);
      roomRef.child('challengeResponse').remove();
    }
  });
}
function respondOnlineChallenge(accepted){
  document.getElementById('challengeModal')?.remove();
  roomRef.child('challengeResponse').set({accepted, ts: Date.now()});
}

/* ---------- ANFITRIÃO: cria a sala e comanda o lobby ---------- */
function createOnlineRoom(){
  const statusEl0 = document.getElementById('onlineStatus');
  if(!ensureFirebase()){
    statusEl0.innerHTML = `❌ A biblioteca de conexão (Firebase) não carregou. Verifique sua internet e recarregue a página (F5).`;
    return;
  }
  const name = document.getElementById('onlineMyName').value || 'Jogador 1';
  const gender = document.getElementById('onlineMyGender').value;
  const color = document.getElementById('onlineMyColor').value;
  const starter = document.getElementById('onlineMyStarter').value;
  lobbyMapSize = document.querySelector('input[name="onlineMapSize"]:checked').value;
  const code = genRoomCode();
  roomCode = code; onlineMode = true; isHostFlag = true; myToken = getMyToken();
  roomRef = fbDb.ref('rooms/'+code);
  roomRef.child('meta').set({mapSize:lobbyMapSize, started:false, createdAt:firebase.database.ServerValue.TIMESTAMP});
  roomRef.child('lobby').push({name, gender, color, starter, token:myToken, joinedAt:firebase.database.ServerValue.TIMESTAMP});
  listenToLobby();
  updateConnectionBadge();
  renderHostLobby(code, `Sala criada! Aguardando jogadores entrarem...`);
}
function listenToLobby(){
  roomRef.child('lobby').on('value', snap=>{
    const val = snap.val() || {};
    lobbyPlayers = Object.values(val).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
    if(isHostFlag) renderHostLobby(roomCode);
    else renderJoinerLobby(lobbyPlayers);
  });
  roomRef.child('meta/started').on('value', snap=>{
    if(snap.val()===true) attachStateListener();
  });
}
function renderHostLobby(code, extraMsg){
  const statusEl = document.getElementById('onlineStatus');
  if(!statusEl) return;
  statusEl.innerHTML = `
    <div class="box" style="margin-top:8px;">
      <h3>🌐 Lobby da sala</h3>
      <p><b>Código da sala: <span style="font-size:26px; letter-spacing:2px;">${code}</span></b></p>
      <p class="small">Passe esse código pros outros jogadores. Você (anfitrião) decide quando começar — pode iniciar com 2 até 8 jogadores.</p>
      ${extraMsg?`<p class="small">${extraMsg}</p>`:''}
      <div id="lobbyPlayerList">${lobbyPlayers.map((p,i)=>`<div class="row"><span>${trainerSpriteSVG(p.color,20,p.gender)}</span><b>${p.name}</b>${p.token===myToken?' (você, anfitrião)':''}</div>`).join('')}</div>
      <button class="green" style="margin-top:10px;" onclick="startOnlineGameAsHost()" ${lobbyPlayers.length<2?'disabled title="Espere pelo menos mais 1 jogador entrar"':''}>▶️ Iniciar Partida (${lobbyPlayers.length}/8)</button>
    </div>
  `;
}
function startOnlineGameAsHost(){
  if(lobbyPlayers.length<2) return;
  setupMap(lobbyMapSize);
  const starts = computeStartZones(lobbyPlayers.length);
  const players = lobbyPlayers.map((lp,i)=>{
    const p = { id:i, name:lp.name, gender:lp.gender, color:lp.color, zone:starts[i], gold:50, items:{"Poção":2,"Pokébola":5},
      team:[], zonesVisited:new Set([starts[i]]), pvpWins:0, isBot:false, disconnected:false, token:lp.token,
      eliminated:false, itemUsedThisTurn:false, turnsTaken:1, masterBallLastUsedTurn:null, challengeImmuneUntilTurn:0 };
    giveStarterPokemon(p, lp.starter || 'Pikachu');
    return p;
  });
  players.forEach(p=>{ p.missions=[generateMission('facil',p), generateMission('media',p), generateMission('dificil',p)]; });
  state = {
    turnCount:1, currentPlayerIdx:0, round:1, eventActive:null, eventRoundsLeft:0, eventCountdown:EVENT_INTERVAL,
    history:[], diceLog:[], gameOver:false, shopUsedThisTurn:false,
    players, phase:'movement', stepsRemaining:0, running:false
  };
  logEvent(`Partida online iniciada com ${players.length} jogador(es) em um mapa ${lobbyMapSize} (${GRID_SIZE}x${GRID_SIZE}).`);
  lastSeenTurnOwner = players[0].id;
  myTurnStarted = false;
  attachStateListener();
  broadcastStateIfNeededForce();
  roomRef.child('meta/started').set(true);
}
/** Igual broadcastStateIfNeeded, mas sem exigir "estar no controle" — usado só na criação da partida. */
function broadcastStateIfNeededForce(){
  const payload = JSON.parse(JSON.stringify(state, (k,v)=> v instanceof Set ? Array.from(v) : v));
  payload.__mapMeta = { GRID_SIZE, TOTAL_ZONES, CENTER_ZONE, SHOP_ZONE, TUNNEL_ZONES: Array.from(TUNNEL_ZONES) };
  roomRef.child('state').set(payload);
}

/* ---------- QUEM ENTRA: conecta, entra no lobby ou reconecta numa partida em andamento ---------- */
function joinOnlineRoom(){
  if(!ensureFirebase()){
    document.getElementById('onlineStatus').innerHTML = `❌ A biblioteca de conexão (Firebase) não carregou. Verifique sua internet e recarregue a página (F5).`;
    return;
  }
  const name = document.getElementById('onlineMyName').value || 'Jogador';
  const gender = document.getElementById('onlineMyGender').value;
  const color = document.getElementById('onlineMyColor').value;
  const starter = document.getElementById('onlineMyStarter').value;
  const code = (document.getElementById('joinRoomCode').value||'').trim().toUpperCase();
  if(!code){ alert('Digite o código da sala.'); return; }
  const statusEl = document.getElementById('onlineStatus');
  statusEl.innerHTML = `Procurando a sala ${code}...`;
  roomCode = code; onlineMode = true; isHostFlag = false; myToken = getMyToken();
  roomRef = fbDb.ref('rooms/'+code);
  updateConnectionBadge();
  roomRef.once('value').then(snap=>{
    if(!snap.exists()){ statusEl.innerHTML = `❌ Essa sala não existe. Confira o código.`; onlineMode=false; return; }
    const data = snap.val();
    if(data.meta && data.meta.started){
      statusEl.innerHTML = `Sala já em andamento — procurando seu lugar nela...`;
      const players = (data.state && data.state.players) || [];
      let idx = players.findIndex(pl=>pl && pl.token===myToken);
      if(idx===-1) idx = players.findIndex(pl=>pl && pl.disconnected && pl.name===name);
      if(idx===-1){
        statusEl.innerHTML = `❌ Essa sala já está em andamento e não encontramos seu lugar nela. Se você já jogou aqui antes, use exatamente o mesmo nome.`;
        onlineMode = false;
        return;
      }
      roomRef.child(`state/players/${idx}/disconnected`).set(false);
      roomRef.child(`state/players/${idx}/token`).set(myToken);
      statusEl.innerHTML = `✅ Reconectado à partida!`;
      attachStateListener();
    } else {
      statusEl.innerHTML = `✅ Entrando na sala...`;
      roomRef.child('lobby').push({name, gender, color, starter, token:myToken, joinedAt:firebase.database.ServerValue.TIMESTAMP});
      listenToLobby();
    }
  }).catch(err=>{ statusEl.innerHTML = `❌ Erro: ${err.message}. Confira sua internet e tente de novo.`; });
}
function renderJoinerLobby(players){
  const statusEl = document.getElementById('onlineStatus');
  if(!statusEl) return;
  statusEl.innerHTML = `
    <div class="box" style="margin-top:8px;">
      <h3>🌐 Aguardando o anfitrião iniciar...</h3>
      <p class="small">Jogadores na sala (${players.length}/8):</p>
      ${players.map(p=>`<div class="row"><span>${trainerSpriteSVG(p.color,20,p.gender)}</span><b>${p.name}</b>${p.token===myToken?' (você)':''}</div>`).join('')}
    </div>
  `;
}

/* =========================================================
   BOTS DE IA
   ========================================================= */
function renderBotTurnScreen(p){
  const el = document.getElementById('screen-game');
  document.getElementById('floatingPanel')?.remove();
  el.innerHTML = `
    <div class="box center" style="flex-direction:column; gap:14px; padding:40px 20px;">
      <div>${trainerSpriteSVG(p.color, 64, p.gender)}</div>
      <h2 style="font-size:20px;">🤖 ${p.name} está jogando...</h2>
    </div>`;
}
function runBotTurn(p){
  if(state.players[state.currentPlayerIdx]!==p || state.gameOver) return;
  state.awaitingStart = false;
  state.phase = 'movement';
  botDecideMovement(p);
}
function botDecideMovement(p){
  const steps = rollDiceShow(6,1,`${p.name} (bot) — Mover`);
  state.stepsRemaining = steps;
  state.running = false;
  state.moveHistory = [];
  state.phase = 'moving';
  renderGame();
  setTimeout(()=>botStepLoop(p), 350);
}
function botStepLoop(p, iterations){
  iterations = iterations || 0;
  if(state.players[state.currentPlayerIdx]!==p || state.gameOver) return;
  if(state.stepsRemaining<=0){
    state.phase='action';
    renderGame();
    setTimeout(()=>botDecideAction(p), 500);
    return;
  }
  if(iterations>60){
    // trava de segurança: nunca deixa o bot ficar preso andando pra sempre
    logEvent(`${p.name} parou de andar (limite de segurança).`);
    state.stepsRemaining = 0;
    state.moveHistory = [];
    state.phase='action';
    renderGame();
    setTimeout(()=>botDecideAction(p), 500);
    return;
  }
  const lastDir = state.moveHistory[state.moveHistory.length-1];
  const undoDir = lastDir ? OPPOSITE_DIR[lastDir] : null;
  let validDirs = ['up','down','left','right'].filter(d=> d!==undoDir && neighborZone(p.zone,d)!==null);
  if(validDirs.length===0) validDirs = ['up','down','left','right'].filter(d=>neighborZone(p.zone,d)!==null);
  const dir = validDirs.length>0 ? pick(validDirs) : pick(['up','down','left','right']);
  stepMove(dir);
  setTimeout(()=>botStepLoop(p, iterations+1), 300);
}
function botDecideAction(p){
  if(state.players[state.currentPlayerIdx]!==p || state.gameOver) return;
  if(p.zone===CENTER_ZONE){
    healAtCenter();
  } else if(p.zone===SHOP_ZONE){
    state.phase='end';
    renderGame();
  } else {
    const others = state.players.filter(o=>o.id!==p.id && !o.eliminated && o.zone===p.zone);
    const canFight = p.team.slice(0,MAX_ACTIVE).some(m=>m.pv>0);
    if(others.length>0 && canFight && Math.random()<0.4){
      tryChallenge();
    } else {
      doSearch();
    }
  }
  pollBotTurnEnd(p);
}
/** Fica de olho até o turno do bot realmente terminar (sem batalha/modal pendente) e então encerra. */
function pollBotTurnEnd(p, attempts){
  attempts = attempts||0;
  if(state.gameOver || attempts>60) return;
  if(state.players[state.currentPlayerIdx]!==p) return;
  const modalIds = ['encounterModal','challengeModal','battleModal','battleItemPicker','switchPickerModal','useItemModal','runConfirmModal','endTurnConfirmModal'];
  const anyModal = modalIds.some(id=>document.getElementById(id));
  if(!anyModal && !state.activeBattle && state.phase==='end'){
    endTurn();
    return;
  }
  setTimeout(()=>pollBotTurnEnd(p, attempts+1), 400);
}
/** Escolhe a melhor bola disponível e decide capturar (ou batalhar se não tiver nenhuma). */
function botHandleEncounter(p){
  const priority = ['Master Ball','Ultra Ball','Great Ball','Pokébola'];
  let chosen = null;
  for(const ball of priority){
    if(p.items[ball]>0){
      if(ball==='Master Ball' && !masterBallAvailable(p)) continue;
      chosen = ball; break;
    }
  }
  setTimeout(()=>{
    if(chosen) attemptCapture(chosen);
    else startPVE();
  }, 500);
}
/** Decisão automática de ação em batalha, chamada quando o lado que age é controlado por bot. */
function autoBattleTurn(){
  const b = state.activeBattle;
  if(!b) return;
  const humanSide = getHumanSide(b);
  if(!humanSide.player || !humanSide.player.isBot) return;
  const mon = activeOf(humanSide);
  if(!mon) return;
  const p = humanSide.player;
  const hpPct = mon.pv/mon.pvMax;
  const betterAlly = humanSide.team.findIndex((m,i)=> i!==humanSide.currentIndex && m.pv > mon.pv*1.3);
  if(hpPct<=0.3 && !p.itemUsedThisTurn){
    const cura = Object.entries(ITEMS).find(([k,v])=>v.type==='cura' && p.items[k]>0);
    if(cura){ battleAction('item', cura[0]); return; }
  }
  if(hpPct<=0.35 && betterAlly>=0){
    performSwitch(betterAlly);
    return;
  }
  battleAction('attack');
}

/* =========================================================
   BATALHA FINAL (bracket eliminatório)
   ========================================================= */
function startFinalBracket(){
  const contenders = state.players.filter(p=>p.team.length>0 && !p.eliminated);
  state.bracket = {round:1, contenders: contenders.map(p=>p), champion:null};
  renderBracketModal();
}
function renderBracketModal(){
  const br = state.bracket;
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='bracketModal';
  if(br.contenders.length===1){
    br.champion = br.contenders[0];
    overlay.innerHTML = `<div class="box modal"><h2>🏆 CAMPEÃO 🏆</h2><p style="font-size:24px;text-align:center;">${br.champion.name}</p>
      <button class="gold" onclick="document.getElementById('bracketModal').remove(); endGame();">Finalizar</button></div>`;
    document.body.appendChild(overlay);
    return;
  }
  overlay.innerHTML = `<div class="box modal"><h2>Batalha final — Rodada do bracket</h2>
    <p class="small">Confrontos desta rodada (3 vs 3):</p>
    <div id="bracketMatches">${br.contenders.map((p,i)=> i%2===0 && br.contenders[i+1] ? `<div class="row"><b>${p.name}</b> vs <b>${br.contenders[i+1].name}</b> <button onclick="resolveBracketMatch(${i})">Batalhar</button></div>` : (i%2===0 ? `<div class="row"><b>${p.name}</b> avança automaticamente (sem par)</div>` : '')).join('')}</div>
  </div>`;
  document.body.appendChild(overlay);
}
function resolveBracketMatch(i){
  const br = state.bracket;
  const pA = br.contenders[i], pB = br.contenders[i+1];
  document.getElementById('bracketModal').remove();
  const sideA = {player:pA, team: pA.team.slice(0,MAX_ACTIVE), currentIndex:0};
  const sideB = {player:pB, team: pB.team.slice(0,MAX_ACTIVE), currentIndex:0};
  tryAdvance(sideA); tryAdvance(sideB);
  const battle = {type:'PVP-FINAL', a:sideA, b:sideB};
  state.activeBattle = battle;
  state._bracketCallback = (winnerSide)=>{
    br.contenders = br.contenders.filter(p=>p!==pA && p!==pB);
    br.contenders.push(winnerSide.player);
    renderBracketModal();
  };
  runBattle(battle);
}
const _originalFinishBattle = finishBattle;
finishBattle = function(winnerSide){
  const b = state.activeBattle;
  if(b && b.type==='PVP-FINAL'){
    document.getElementById('battleModal')?.remove();
    const winner = winnerSide || b.a;
    logEvent(`${winner.player.name} venceu o confronto do bracket!`);
    showBigMessage(`🏆 ${winner.player.name} avança no bracket!`, 'good');
    state.activeBattle=null;
    if(state._bracketCallback) state._bracketCallback(winner);
    return;
  }
  _originalFinishBattle(winnerSide);
};

function endGame(){ state.gameOver = true; renderGame(); }
function renderEndgame(){
  const el = document.getElementById('screen-game');
  document.getElementById('floatingPanel')?.remove();
  el.innerHTML = `<div class="box"><h2>Fim de jogo!</h2>
    <p>🏆 Campeão: <b>${state.bracket && state.bracket.champion ? state.bracket.champion.name : '—'}</b></p>
    <button onclick="location.reload()">Nova partida</button>
  </div>`;
}

/* init */
renderSetup();
</script>
